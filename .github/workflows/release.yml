# 推送 v* 标签（如 v0.1.0）时：检查、打包，把 fdu-cli.tgz 附到 GitHub Release，
# 之后可以 npm install -g https://github.com/sjy0630/fdu-cli/releases/latest/download/fdu-cli.tgz
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack && mv fdu-cli-*.tgz fdu-cli.tgz
      # 说明取自 CHANGELOG.md 里这个版本的那一节
      - run: awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 { p = 1; next } /^## / { if (p) exit } p' CHANGELOG.md > notes.md && test -s notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" fdu-cli.tgz --title "fdu-cli $GITHUB_REF_NAME" --notes-file notes.md
