# 发布新版本：推送 v* 标签（如 v0.1.0），或在 Actions 页面手动运行（用 package.json 里的版本号建标签）。
# 检查、打包，把 fdu-cli.tgz 附到 GitHub Release，并发布到 npm。
# npm 用可信发布（OIDC，不需要令牌）：要先在 npmjs.com 的包设置里把这个仓库和 release.yml 设为 Trusted Publisher。
# 重新运行是安全的：已经存在的 Release、npm 上已有的版本会跳过。
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: 版本号
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "标签 $GITHUB_REF_NAME 和 package.json 的版本 $version 不一致"; exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- dist
      - run: npm pack && mv fdu-cli-*.tgz fdu-cli.tgz
      # 说明取自 CHANGELOG.md 里这个版本的那一节
      - run: awk -v v="## $VERSION " 'index($0, v) == 1 { p = 1; next } /^## / { if (p) exit } p' CHANGELOG.md > notes.md && test -s notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" fdu-cli.tgz --target "$GITHUB_SHA" --title "fdu-cli $TAG" --notes-file notes.md
      - name: 发布到 npm
        run: |
          # 第一次要在本机手动发布，并在 npmjs.com 设好 Trusted Publisher，之后的版本才由这里发布
          if ! npm view fdu-cli name >/dev/null 2>&1; then echo "npm 上还没有 fdu-cli，跳过（第一次请手动发布）"; exit 0; fi
          if npm view "fdu-cli@$VERSION" version >/dev/null 2>&1; then echo "npm 上已有 $VERSION，跳过"; exit 0; fi
          npm install -g npm@^11.5.1
          npm publish fdu-cli.tgz --access public
